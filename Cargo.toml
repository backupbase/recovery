[package]
name = "backupbase-restore"
version = "0.1.2"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Open-source command-line restore tool for Backup Base backups (vault format versions 1 and 2)"
readme = "README.md"
publish = false

# A standalone crate: written from FORMAT.md only, with no code shared with the Backup Base app.
[workspace]

[[bin]]
name = "backupbase-restore"
path = "src/main.rs"

[lib]
name = "bbrestore"
path = "src/lib.rs"

# Versions are pinned. All dependencies are pure Rust (rpassword and filetime call the OS
# directly), so static builds need no C toolchain beyond the platform linker.
[dependencies]
aes-gcm = { version = "=0.11.1", features = ["zeroize"] }
argon2 = { version = "=0.6.0", features = ["zeroize"] }
hkdf = "=0.13.0"
hmac = "=0.13.0"
sha2 = "=0.11.0"
zeroize = "=1.9.0"
base64 = "=0.22.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
unicode-normalization = "=0.1.25"
ruzstd = "=0.9.0"
rpassword = "=7.5.4"
filetime = "=0.2.29"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "unwind"

# Tests decrypt with real Argon2id parameters: optimise dependencies in debug builds too.
[profile.dev.package."*"]
opt-level = 3

[dev-dependencies]
tempfile = "=3.27.0"
